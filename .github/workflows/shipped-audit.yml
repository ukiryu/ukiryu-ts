name: Shipped audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: shipped-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    name: Gated publishing, no secrets, consistent versions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -r scripts/requirements-release.txt
      - run: python3 scripts/shipped-audit.py
      - run: python3 scripts/test-npm-release.py
